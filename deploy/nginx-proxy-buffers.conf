# ============================================================
# Deployed to /etc/nginx/conf.d/proxy-buffers.conf on the app server.
# Reload with: sudo nginx -t && sudo systemctl reload nginx
#
# WHY THIS FILE EXISTS
# nginx reads the upstream's response HEADERS into a single buffer of
# `proxy_buffer_size`, which defaults to one memory page (4k on this box).
# If the headers do not fit, nginx drops the response and answers
# 502 Bad Gateway, logging:
#   "upstream sent too big header while reading response header from upstream"
#
# Our baseline response headers are ~1.2 KB (security headers + CSP), but
# whenever src/proxy.ts refreshes a Supabase session it adds Set-Cookie for
# the chunked auth cookie (sb-<ref>-auth-token.0, .1, ... ~3 KB each) plus
# expiry headers for stale chunks. That easily crosses 4k, so a user whose
# access token had expired got a 502 on EVERY request while another browser
# with a fresh token worked fine. Confirmed in /var/log/nginx/error.log on
# 2 Oct 2026 (13 occurrences, incl. GET /settings and /super-admin).
#
# Clearing cookies "fixes" it only until that session next needs a refresh,
# so this is the actual fix. Memory cost is per active request and small.
# ============================================================

# Response headers from the app (Set-Cookie for chunked auth tokens).
proxy_buffer_size       32k;
proxy_buffers           8 32k;
proxy_busy_buffers_size 64k;

# Request headers from the browser. The same chunked cookies come back in
# the Cookie header; the default (4 x 8k) answers 400 "Request Header Or
# Cookie Too Large" once they pass 8k — the same bug, the other direction.
large_client_header_buffers 4 32k;
