# ============================================================
# Deployed to /etc/nginx/conf.d/upload-size.conf on the app server.
# Reload with: sudo nginx -t && sudo systemctl reload nginx
#
# WHY THIS FILE EXISTS
# nginx's default `client_max_body_size` is 1 MB. The site config had no
# override, so in production every upload over ~1 MB was rejected by nginx
# with 413 BEFORE it ever reached Next.js — while the app itself happily
# advertised 5 MB images, 16 MB video and 100 MB PDFs
# (src/lib/storage/media-folders.ts). Locally there is no nginx in front of
# `next dev`, which is exactly why uploads worked on a dev machine and
# failed on the server.
#
# Measured on 20 Aug 2026 against https://wacrm.junkiescoder.com:
#   0.8 MB POST to the upload route -> 401  (reached the app, no session)
#   2.2 MB POST to the upload route -> 413  (killed by nginx)
#
# ─── STILL NEEDED AFTER THE MOVE TO PRESIGNED UPLOADS ───
# Media uploads no longer come through here at all: the browser now PUTs
# straight to S3 with a presigned URL (`POST /api/storage/presign` mints
# it, and only the tiny JSON request passes through nginx). So the 25 MB
# below is NOT what limits a customer's 100 MB PDF any more.
#
# It still matters, because these routes DO stream a file body through
# nginx into the app:
#   /api/super-admin/upload
#   /api/super-admin/cms/images
# Both are server-side CMS uploads that read the file into memory, and both
# would silently fail at 1 MB without this. Removing this file would
# reintroduce that.
#
# ─── WHY 25M AND NOT 110M ───
# The two super-admin routes above still do `Buffer.from(await
# file.arrayBuffer())`, so the file is resident in memory twice. This box
# has 903 MB of RAM with roughly 400 MB available, so allowing 100 MB
# through them would spike ~300 MB for a single request and put the
# container within range of the OOM killer.
#
# If a super-admin route ever needs to accept something genuinely large,
# move it to a presigned upload like the media path did rather than raising
# this number.
# ============================================================

client_max_body_size 25M;

# A slow mobile client uploading 25 MB needs longer than the 60s default
# to finish sending the body. Without this, large uploads on poor
# connections fail as 408 rather than 413 — a different error for the same
# underlying "the file is big" cause, which makes it look like a new bug.
client_body_timeout 300s;
