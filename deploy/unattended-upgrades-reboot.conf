// ============================================================
// Deployed to /etc/apt/apt.conf.d/52unattended-upgrades-reboot
//
// Reload is not a thing for apt config — it is read on each run. Verify
// with:  sudo apt-config dump | grep -i automatic-reboot
//
// WHY THIS FILE EXISTS
// `unattended-upgrades` was already active and installing security
// patches, but its reboot option ships commented out in
// /etc/apt/apt.conf.d/50unattended-upgrades. So the box installed kernels
// forever and never restarted into them: on 20 Aug 2026 it was running
// 7.0.0-1006-aws with 1010 and 1011 sitting installed on disk, and
// /var/run/reboot-required had been set for over two weeks. The pending
// list grew from two kernels to three in a single day.
//
// The effect is worse than "updates are late". A kernel is loaded into
// memory at boot and cannot be swapped while running, so the security
// fixes were present on disk and doing nothing at all — which reads as
// patched on any package audit while the running system is not.
//
// A HIGHER-NUMBERED file rather than an edit to 50unattended-upgrades:
// apt reads conf.d in order and last write wins, so 52 overrides 50
// without touching a distro-managed file that a package upgrade may
// rewrite. Reverting is deleting this file.
// ============================================================

Unattended-Upgrade::Automatic-Reboot "true";

// 20:00 UTC = 01:30 IST. Chosen against the OPERATOR's clock, not the
// server's: this CRM is used from India, so business hours are roughly
// 03:30-15:30 UTC and a 02:00 UTC default would land at 07:30 IST, right
// as the day starts.
//
// This only fires on nights when a reboot is actually required, not every
// night. Downtime is 1-2 minutes; Docker is enabled at boot and the
// container's restart policy is `unless-stopped`, so the app comes back
// without a human. Inbound WhatsApp messages are not lost — Meta retries
// webhook deliveries that fail — and a missed 5-minute cron tick is
// already tolerated by design.
Unattended-Upgrade::Automatic-Reboot-Time "20:00";

// Without this, a single logged-in session BLOCKS the reboot indefinitely.
// Both the owner and any agent work over SSH, so a forgotten terminal
// would silently restore exactly the situation this file exists to fix.
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
